<!DOCTYPE html>
<html lang="en">

<head>
    <title>NYC Congestion Pricing Impact</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Analysis of NYC Congestion Pricing Impact using Vision-Based Methods">
    <meta name="theme-color" content="#0a121d">
    <link rel="icon" type="image/x-icon" href="../static/images/favicon.ico">
    <link rel="preload" href="../static/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="../static/vendor/maplibre/maplibre-gl.js">
    <link rel="modulepreload" href="../static/vendor/maplibre/maplibre-gl-shared.js">
    <link rel="stylesheet" href="../static/css/tokens.css">
    <link rel="stylesheet" href="../static/vendor/maplibre/maplibre-gl.css">
    <link rel="stylesheet" href="assets/app.css">
    <script>
        (function () {
            var t = 'dark';
            try { t = localStorage.getItem('nyc-cp-theme') || 'dark'; } catch (e) { }
            document.documentElement.dataset.boot = t;
        })();
    </script>
    <script src="../static/vendor/pmtiles/pmtiles.js" defer></script>
    <script type="module" src="assets/impact.js"></script>
</head>

<body data-theme="dark">
    <script>document.body.dataset.theme = document.documentElement.dataset.boot === 'light' ? 'light' : 'dark';</script>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v5.5M12 7.6v.1" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" /><circle cx="12" cy="12" r="2" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" /></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.8v2.4M12 18.8v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7" /></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.7A8 8 0 0 1 9.3 4.5a8 8 0 1 0 10.2 10.2Z" /></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></symbol>
    </svg>

    <div class="app js-intro" data-app>
        <div id="map" class="app__map" role="region" aria-label="NYC Congestion Pricing Impact"></div>

        <div class="loading" id="loading" aria-hidden="true" data-fallback="../static/images/preview-interactive.webp"><span class="loading__mark"></span></div>

        <aside class="panel info" aria-labelledby="panel-title">
            <h1 class="panel__title" id="panel-title">Peak Hour Differential (PHD)</h1>
            <dl class="stats">
                <div class="stats__row stats__row--crz">
                    <dt>CRZ (Congestion Relief Zone)</dt>
                    <dd id="crz-stat"></dd>
                </div>
                <div class="stats__row">
                    <dt>non-CRZ</dt>
                    <dd id="control-stat"></dd>
                </div>
            </dl>
            <div class="stats__raw" id="raw-stats">
                <span class="stats__raw-label">Absolute Change (Vehicles)</span>
                <div class="stats__raw-values">
                    <span>CRZ: <b id="crz-raw-stat"></b></span>
                    <span>non-CRZ: <b id="control-raw-stat"></b></span>
                </div>
            </div>
            <p class="panel__meta" id="sample-size"></p>
            <a href="https://mkturkcan.github.io/congestionpricing/" target="_blank" rel="noopener" class="panel__about">
                <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg>
                About this project
            </a>
        </aside>

        <section class="panel controls" data-sheet aria-label="View">
            <div class="control">
                <span class="control__label" id="metric-label">Metric</span>
                <div class="segmented" role="radiogroup" aria-labelledby="metric-label" id="metric-select">
                    <button type="button" role="radio" aria-checked="true" data-value="pct">Percentage Change (%)</button>
                    <button type="button" role="radio" aria-checked="false" data-value="raw">Absolute Change (Count)</button>
                </div>
            </div>
            <div class="control">
                <span class="control__label" id="day-label">Day Type</span>
                <div class="segmented" role="radiogroup" aria-labelledby="day-label" id="day-select">
                    <button type="button" role="radio" aria-checked="true" data-value="all">All Week</button>
                    <button type="button" role="radio" aria-checked="false" data-value="weekday">Weekdays</button>
                    <button type="button" role="radio" aria-checked="false" data-value="weekend">Weekends</button>
                </div>
            </div>
        </section>

        <section class="panel legend" data-legend aria-labelledby="legend-title">
            <button class="legend__toggle" type="button" aria-expanded="false" aria-labelledby="legend-title" data-legend-toggle>
                <span class="legend__scale" data-legend-scale aria-hidden="true"></span>
                <svg class="icon" aria-hidden="true"><use href="#i-chevron" /></svg>
            </button>
            <div class="legend__body">
                <h2 class="legend__title" id="legend-title" data-legend-title></h2>
                <ul class="legend__items" data-legend-items></ul>
                <div class="legend__foot">
                    Circle size &prop; magnitude<br>
                    <strong>Bold border</strong> = CRZ
                </div>
            </div>
        </section>

        <button class="panel theme-toggle" id="theme-toggle" type="button">
            <svg class="icon icon--sun" aria-hidden="true"><use href="#i-sun" /></svg>
            <svg class="icon icon--moon" aria-hidden="true"><use href="#i-moon" /></svg>
            <span data-theme-label>Light Mode</span>
        </button>

        <div class="panel tools" role="group" aria-label="Map">
            <button type="button" data-zoom-in aria-label="Zoom in"><svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg></button>
            <button type="button" data-zoom-out aria-label="Zoom out"><svg class="icon" aria-hidden="true"><use href="#i-minus" /></svg></button>
            <hr>
            <button type="button" data-home aria-label="Reset view"><svg class="icon" aria-hidden="true"><use href="#i-home" /></svg></button>
        </div>

        <div class="tip" data-tip role="tooltip"></div>
    </div>
    <script>
        // If the app module never ran (old browser, failed download), show a still of the map.
        document.addEventListener('DOMContentLoaded', function () {
            if (window.__appBoot) return;
            var l = document.getElementById('loading');
            l.classList.add('is-fallback');
            l.style.backgroundImage = 'url("' + l.getAttribute('data-fallback') + '")';
        });
    </script>
</body>

</html>
