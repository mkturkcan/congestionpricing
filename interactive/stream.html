<!DOCTYPE html>
<html lang="en">

<head>
    <title>NYC Traffic - Real-Time Viewer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f2ed">
    <link rel="icon" type="image/x-icon" href="../static/images/favicon.ico">
    <link rel="preload" href="../static/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="../static/vendor/maplibre/maplibre-gl.js">
    <link rel="modulepreload" href="../static/vendor/maplibre/maplibre-gl-shared.js">
    <link rel="stylesheet" href="../static/css/tokens.css">
    <link rel="stylesheet" href="../static/vendor/maplibre/maplibre-gl.css">
    <link rel="stylesheet" href="assets/app.css">
    <link rel="stylesheet" href="assets/stream.css">
    <script>
        (function () {
            var t = 'light';
            try { t = localStorage.getItem('nyc-cp-theme') || 'light'; } catch (e) { }
            document.documentElement.dataset.boot = t;
        })();
    </script>
    <script src="../static/vendor/pmtiles/pmtiles.js" defer></script>
    <script src="../static/vendor/mqtt/mqtt.min.js" defer></script>
    <script type="module" src="assets/stream.js"></script>
</head>

<body data-theme="light">
    <script>document.body.dataset.theme = document.documentElement.dataset.boot === 'dark' ? 'dark' : 'light';</script>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v5.5M12 7.6v.1" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" /><circle cx="12" cy="12" r="2" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" /></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.8v2.4M12 18.8v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7" /></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.7A8 8 0 0 1 9.3 4.5a8 8 0 1 0 10.2 10.2Z" /></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></symbol>
    </svg>

    <div class="app js-intro" data-app>
        <div id="map" class="app__map" role="region" aria-label="NYC Traffic - Real-Time Viewer"></div>

        <div class="loading" id="loading" aria-hidden="true" data-fallback="../static/images/preview-stream.webp"><span class="loading__mark"></span></div>

        <aside class="panel info info--live" aria-live="off">
            <div class="live-stat">
                <span class="live-dot" data-status="connecting" aria-hidden="true"></span>
                <span class="live-stat__label">Last Update</span>
                <span class="live-stat__value" id="last-update">--:--:--</span>
            </div>
            <a href="https://mkturkcan.github.io/congestionpricing/" target="_blank" rel="noopener" class="panel__about">
                <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg>
                About this project
            </a>
        </aside>

        <section class="panel controls controls--live" data-sheet aria-labelledby="view-title">
            <h2 class="control__label" id="view-title">View</h2>
            <div class="presets" role="group" aria-labelledby="view-title">
                <button type="button" class="preset" data-preset="all" aria-pressed="true">All</button>
                <button type="button" class="preset" data-preset="cars" aria-pressed="false">Cars</button>
                <button type="button" class="preset" data-preset="bikes" aria-pressed="false">Bikes</button>
                <button type="button" class="preset" data-preset="buses" aria-pressed="false">Buses</button>
                <button type="button" class="preset" data-preset="trucks" aria-pressed="false">Trucks</button>
            </div>
            <button type="button" class="advanced-toggle" id="advanced-toggle" aria-expanded="false" aria-controls="advanced-options">
                <span>Advanced</span>
                <svg class="icon" aria-hidden="true"><use href="#i-chevron" /></svg>
            </button>
            <div class="advanced-options" id="advanced-options" hidden>
                <label class="check"><input type="checkbox" id="filter-bikes" checked><span class="check__box" aria-hidden="true"></span>Bicycles</label>
                <label class="check"><input type="checkbox" id="filter-cars" checked><span class="check__box" aria-hidden="true"></span>Cars</label>
                <label class="check"><input type="checkbox" id="filter-motorcycles" checked><span class="check__box" aria-hidden="true"></span>Motorcycles</label>
                <label class="check"><input type="checkbox" id="filter-buses" checked><span class="check__box" aria-hidden="true"></span>Buses</label>
                <label class="check"><input type="checkbox" id="filter-trucks" checked><span class="check__box" aria-hidden="true"></span>Trucks</label>
            </div>
        </section>

        <section class="panel legend" data-legend aria-labelledby="legend-title">
            <button class="legend__toggle" type="button" aria-expanded="false" aria-labelledby="legend-title" data-legend-toggle>
                <span class="legend__scale" data-legend-scale aria-hidden="true"></span>
                <svg class="icon" aria-hidden="true"><use href="#i-chevron" /></svg>
            </button>
            <div class="legend__body">
                <h2 class="legend__title" id="legend-title">Vehicle Count per Frame</h2>
                <label class="switch">
                    <input type="checkbox" id="show-empty-cameras" checked>
                    <span class="switch__track" aria-hidden="true"></span>
                    Show empty cameras
                </label>
                <ul class="legend__items" data-legend-items>
                    <li class="legend__item" id="legend-zero"><span class="legend__swatch legend__swatch--ring"></span>0 (No detection)</li>
                    <li class="legend__item"><span class="legend__swatch" data-bin="0"></span>1-4</li>
                    <li class="legend__item"><span class="legend__swatch" data-bin="1"></span>5-9</li>
                    <li class="legend__item"><span class="legend__swatch" data-bin="2"></span>10-19</li>
                    <li class="legend__item"><span class="legend__swatch" data-bin="3"></span>20-29</li>
                    <li class="legend__item"><span class="legend__swatch" data-bin="4"></span>30+</li>
                </ul>
                <div class="legend__foot">
                    Circle size = vehicle count per frame<br>
                    Color intensity = density
                </div>
            </div>
        </section>

        <button class="panel theme-toggle" id="theme-toggle" type="button">
            <svg class="icon icon--sun" aria-hidden="true"><use href="#i-sun" /></svg>
            <svg class="icon icon--moon" aria-hidden="true"><use href="#i-moon" /></svg>
            <span data-theme-label>Light Mode</span>
        </button>

        <div class="panel tools" role="group" aria-label="Map">
            <button type="button" data-zoom-in aria-label="Zoom in"><svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg></button>
            <button type="button" data-zoom-out aria-label="Zoom out"><svg class="icon" aria-hidden="true"><use href="#i-minus" /></svg></button>
            <hr>
            <button type="button" data-home aria-label="Reset view"><svg class="icon" aria-hidden="true"><use href="#i-home" /></svg></button>
        </div>

        <div class="tip" data-tip role="tooltip"></div>
    </div>
    <script>
        // If the app module never ran (old browser, failed download), show a still of the map.
        document.addEventListener('DOMContentLoaded', function () {
            if (window.__appBoot) return;
            var l = document.getElementById('loading');
            l.classList.add('is-fallback');
            l.style.backgroundImage = 'url("' + l.getAttribute('data-fallback') + '")';
        });
    </script>
</body>

</html>
